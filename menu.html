<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Planner - Dashboard Menu</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-emerald: #10b981;
            --accent-purple: #a855f7;
            --accent-rose: #f43f5e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        .intro-banner {
            background: linear-gradient(135deg, #1e1b4b 0%, #311042 100%);
            border: 1px solid var(--accent-blue);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .intro-banner h1 { font-size: 2rem; margin-bottom: 8px; color: #fff; }
        .intro-banner p { color: var(--text-muted); font-size: 1.05rem; }

        .workspace-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        @media (max-width: 768px) {
            .workspace-grid { grid-template-columns: 1fr; }
        }

        .panel {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .panel-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: #fff;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        /* Form Controls */
        .form-group { display: flex; flex-direction: column; margin-bottom: 12px; }
        .form-group label { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; }
        .form-group input {
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            color: #fff;
            font-size: 1rem;
        }
        .form-group input:focus { outline: none; border-color: var(--accent-blue); }

        /* Stats Bar Layout */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            margin-top: 16px;
        }

        .stat-box {
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            text-align: center;
            position: relative;
        }

        .stat-box .label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }
        .stat-box .value { font-size: 1.2rem; font-weight: 700; margin-top: 4px; color: #fff; }
        
        .remove-stat-btn {
            position: absolute;
            top: 2px;
            right: 5px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
            border: none;
            background: none;
        }
        .remove-stat-btn:hover { color: var(--accent-rose); }

        .btn {
            background-color: var(--accent-emerald);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px 20px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
            margin-top: auto;
            text-align: center;
            text-decoration: none;
        }
        .btn:hover { opacity: 0.9; }
        .btn-blue { background-color: var(--accent-blue); }

        /* Plan List styles */
        .plan-list { list-style: none; }

        .plan-item {
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent-purple);
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .plan-item.default-plan { border-left-color: var(--accent-blue); }
        .plan-clickable { cursor: pointer; flex-grow: 1; }
        .plan-item:hover .plan-clickable strong { color: var(--accent-blue); }
        .plan-details { font-size: 0.85rem; color: var(--text-muted); }
        
        .btn-delete-plan {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            margin-left: 10px;
        }
        .btn-delete-plan:hover {
            background-color: rgba(244, 63, 94, 0.1);
            color: var(--accent-rose);
            border-color: var(--accent-rose);
        }
    </style>
</head>
<body>

<div class="container">

    <header class="intro-banner">
        <h1>Fitness Planner Pro</h1>
        <p>A data-driven infrastructure built to track structural routines, calculate biometric targets baseline values, and manage progressive training mesocycles.</p>
    </header>

    <div class="workspace-grid">
        <div class="panel">
            <div class="panel-title">Initialize New Workout Plan</div>
            
            <div class="form-group">
                <label for="planName">Plan Name</label>
                <input type="text" id="planName" placeholder="e.g., Push/Pull/Legs Split">
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
                <div class="form-group">
                    <label for="age">Age (yrs)</label>
                    <input type="number" id="age" value="25">
                </div>
                <div class="form-group">
                    <label for="height">Height (cm)</label>
                    <input type="number" id="height" value="180">
                </div>
                <div class="form-group">
                    <label for="weight">Weight (kg)</label>
                    <input type="number" id="weight" value="75">
                </div>
            </div>

            <div class="form-group">
                <label>Add Extra Stat Box Field</label>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="customStatName" placeholder="e.g., Body Fat %" style="flex: 1;">
                    <button type="button" class="btn btn-blue" style="margin: 0; padding: 0 15px;" onclick="addNewStatBox()">+ Add Field</button>
                </div>
            </div>

            <div class="stats-bar" id="dynamicStatsBar">
                <div class="stat-box" id="bmiStaticBox">
                    <div class="label">Calculated BMI</div>
                    <div class="value" id="liveBmi">--</div>
                </div>
            </div>

            <button class="btn" style="margin-top: 20px;" onclick="generateWorkoutPlan()">Commit & Save New Plan</button>
        </div>

        <div class="panel">
            <div class="panel-title">Your Created Active Plans</div>
            <div id="plansContainer">
                <ul class="plan-list" id="savedPlansList">
                    </ul>
            </div>
        </div>
    </div>
</div>

<script>
    // In-memory data store initializing with index.html recognized as "My Plan"
    let createdPlans = [
        {
            id: 'default_index',
            name: 'My Plan',
            age: '--',
            height: '--',
            weight: '--',
            bmi: 'Link Active',
            isDefault: true,
            url: 'index.html'
        }
    ];

    function calculateBmiMetric(weight, height) {
        if (!weight || !height || height <= 0) return "--";
        const heightM = height / 100;
        return (weight / (heightM * heightM)).toFixed(1);
    }

    // Interactive helper: Appends user custom-defined measurement nodes with a removal button
    function addNewStatBox() {
        const inputField = document.getElementById('customStatName');
        const labelText = inputField.value.trim();

        if (!labelText) {
            alert("Please enter a custom statistic parameter label.");
            return;
        }

        const bar = document.getElementById('dynamicStatsBar');
        
        const box = document.createElement('div');
        box.className = 'stat-box';
        
        // Add delete trigger to custom fields
        const removeBtn = document.createElement('button');
        removeBtn.className = 'remove-stat-btn';
        removeBtn.innerHTML = '&times;';
        removeBtn.title = "Remove this stat field";
        removeBtn.onclick = function() { box.remove(); };
        
        const lbl = document.createElement('div');
        lbl.className = 'label';
        lbl.innerText = labelText;
        
        const val = document.createElement('div');
        val.className = 'value';
        val.contentEditable = "true";
        val.innerText = "- -";
        val.style.outline = "none";
        
        box.appendChild(removeBtn);
        box.appendChild(lbl);
        box.appendChild(val);
        bar.appendChild(box);
        
        inputField.value = "";
    }

    // Core validation and compilation tool for new structural routines
    function generateWorkoutPlan() {
        const nameField = document.getElementById('planName');
        const planName = nameField.value.trim();
        const age = parseInt(document.getElementById('age').value);
        const height = parseFloat(document.getElementById('height').value);
        const weight = parseFloat(document.getElementById('weight').value);

        if (!planName) {
            alert("Please supply an identifying title name for your Workout Plan.");
            return;
        }

        const finalBmi = calculateBmiMetric(weight, height);
        document.getElementById('liveBmi').innerText = finalBmi;

        const extraStats = [];
        const extraBoxes = document.querySelectorAll('#dynamicStatsBar .stat-box');
        extraBoxes.forEach(box => {
            if (box.id === 'bmiStaticBox') return; // Skip base BMI module
            const label = box.querySelector('.label').innerText;
            const value = box.querySelector('.value').innerText;
            extraStats.push({ label, value });
        });

        const newPlan = {
            id: 'plan_' + Date.now(),
            name: planName,
            age: age,
            height: height,
            weight: weight,
            bmi: finalBmi,
            customMetrics: extraStats,
            isDefault: false,
            url: '#'
        };

        createdPlans.push(newPlan);
        renderPlansDashboard();

        nameField.value = "";
    }

    // Function to safely delete a user-created plan layout
    function deletePlan(planId) {
        createdPlans = createdPlans.filter(p => p.id !== planId);
        renderPlansDashboard();
    }

    // Render active plans list tracking rows
    function renderPlansDashboard() {
        const listContainer = document.getElementById('savedPlansList');
        listContainer.innerHTML = "";

        createdPlans.forEach(plan => {
            const li = document.createElement('li');
            li.className = plan.isDefault ? 'plan-item default-plan' : 'plan-item';

            // Clickable workspace routing context wrapper
            const contentWrapper = document.createElement('div');
            contentWrapper.className = 'plan-clickable';
            contentWrapper.onclick = () => selectPlanRoute(plan);
            
            if (plan.isDefault) {
                contentWrapper.innerHTML = `
                    <strong>${plan.name}</strong>
                    <div class="plan-details">Core configuration root workflow file (index.html)</div>
                `;
            } else {
                contentWrapper.innerHTML = `
                    <div>
                        <strong>${plan.name}</strong>
                        <div class="plan-details">Metrics logged: W: ${plan.weight}kg | H: ${plan.height}cm | <strong>BMI: ${plan.bmi}</strong></div>
                    </div>
                `;
            }

            li.appendChild(contentWrapper);

            // Append delete button ONLY if it is not the structural "My Plan" default module
            if (!plan.isDefault) {
                const delBtn = document.createElement('button');
                delBtn.className = 'btn-delete-plan';
                delBtn.innerText = 'Delete';
                delBtn.onclick = (e) => {
                    e.stopPropagation(); // Stop parent click routine triggers
                    deletePlan(plan.id);
                };
                li.appendChild(delBtn);
            } else {
                const badge = document.createElement('span');
                badge.style.cssText = "color: var(--accent-blue); font-size: 0.8rem; font-weight: 600; padding-right: 5px;";
                badge.innerText = "Active Root";
                li.appendChild(badge);
            }
            
            listContainer.appendChild(li);
        });
    }

    // Direct routing framework transition execution logic
    function selectPlanRoute(plan) {
        if (plan.isDefault) {
            window.location.href = plan.url; // Shifts UI directly to your original core index file workspace
        } else {
            alert(`Routing application views into dynamic plan layout container:\n"${plan.name}"\n\nBaseline calculation details at entry:\nBMI: ${plan.bmi}\nWeight: ${plan.weight} kg`);
        }
    }

    // Initialization lifecycle hook run
    window.onload = renderPlansDashboard;
</script>

</body>
</html>
